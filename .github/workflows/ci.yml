name: ci

on:
  push:
    branches: [main]
  pull_request:

# Mínimo privilegio: el workflow solo puede leer el repo.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    # Postgres + pgvector efímero, solo para este job.
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ldr
          POSTGRES_PASSWORD: ldr
          POSTGRES_DB: ldr
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ldr"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ldr:ldr@localhost:5433/ldr

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # --locked: falla si uv.lock no coincide con pyproject.toml.
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python -m ldr.migrate
      - run: uv run pytest
